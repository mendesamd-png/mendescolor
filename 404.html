<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · MendesColor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
  /* Servida em qualquer endereco que nao exista, inclusive na raiz. Nao leva
     a lugar nenhum, e e' de proposito. */
  :root {
    --g1: #8B5CF6; --g2: #F472B6; --g3: #38BDF8;
    --grad-txt: linear-gradient(100deg, var(--g1), var(--g2) 45%, var(--g3));
    --radius: 26px;
  }
  :root[data-theme="light"] {
    --bg: #F7F6F3; --text: #17171C; --muted: #55555F; --faint: #78787F;
    --panel: rgba(255,255,255,0.78); --border: rgba(23,23,28,0.09);
    --shadow: rgba(23,23,28,0.07); --accent: #7C3AED;
  }
  :root[data-theme="dark"] {
    --bg: #0C0C11; --text: #F4F4F7; --muted: #A9A9B6; --faint: #75757F;
    --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --shadow: rgba(0,0,0,0.40); --accent: #A78BFA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Onest", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         font-size: 17px; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  section { max-width: 760px; margin: 0 auto; padding: 170px 32px 110px; }
  h2 { font-weight: 600; font-size: clamp(28px, 3.6vw, 46px); letter-spacing: -0.025em;
       line-height: 1.12; margin-bottom: 14px; }
  .sub { font-size: 19px; color: var(--muted); line-height: 1.55; letter-spacing: -0.005em; font-weight: 500; }
  .eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
             color: var(--accent); margin-bottom: 14px; }
  .accent { background: var(--grad-txt); -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent; }
  .glass { background: var(--panel); border: 1px solid var(--border);
           backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
           box-shadow: 0 10px 30px var(--shadow), 0 2px 6px var(--shadow); border-radius: var(--radius); }
  .aurora { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  .aurora::before { content: ""; position: absolute; width: 62vw; height: 62vh; left: -16vw; top: -12vh;
    background: radial-gradient(closest-side, rgba(139,92,246,0.30), transparent); filter: blur(80px); }
  .aurora::after { content: ""; position: absolute; width: 62vw; height: 62vh; right: -18vw; bottom: -16vh;
    background: radial-gradient(closest-side, rgba(56,189,248,0.26), transparent); filter: blur(90px); }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; padding: 14px 24px; }
  .brand { font-weight: 800; text-transform: uppercase; font-size: 13px; letter-spacing: 0.01em;
           padding: 12px 18px; white-space: nowrap; }
  footer { text-align: center; padding: 40px 20px 80px; color: var(--faint); font-size: 13.5px; }
</style>
</head>
<body>
<div class="aurora"></div>
<header>
  <div class="brand glass">Mendes<span class="accent">Color</span></div>
</header>
<section>
  <div class="eyebrow">Erro 404</div>
  <h2>Esse endereço não existe.</h2>
  <p class="sub">O MendesColor está em uso interno na Agência California e não tem página pública
     no momento. Se você tinha um link e ele parou de funcionar, fale direto com o Douglas.</p>
</section>
<footer>MendesColor · California Vol. 1 · by Douglas Mendes</footer>
<script>
  const saved = localStorage.getItem('ccl-theme');
  if (saved) { document.documentElement.dataset.theme = saved; }
</script>
</body>
</html>
